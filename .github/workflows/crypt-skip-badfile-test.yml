# crypt CLI：单文件读取失败不得中断整轮遍历（Windows 专用回归）
#
# 被测行为（cmd/crypt.go）：
#   * filepath.Walk 回调里 cryptFile 返回 error -> log.Errorf + 记入 options.failedFiles + return nil
#   * 遍历结束后 reportFailed() 打印汇总，退出码保持 0
#
# 为什么坏文件用「被其他进程独占锁定」而不是真造 CRC 错：
#   * fsutil 的 setValidData 是唯一能让已分配簇返回 IO 错误的官方命令，但它需要
#     SeManageVolumePrivilege；本地实测返回 "Error 1300: Not all privileges or groups
#     referenced are assigned to the caller"，用 -Verb RunAs 提权在 runner 无人值守
#     会话里也不可靠。
#   * fsutil file setrange / setZeroData 在 windows-2025 镜像自带的 fsutil 里根本不存在
#     （实测 "setrange is an invalid parameter"），不可移植。
#   * WOF 压缩 + 删外部文件：DeleteFile 对仍被打开的文件会失败，MoveFileEx 加
#     MOVEFILE_DELAY_UNTIL_REBOOT 对打开句柄返回 ERROR_SHARING_VIOLATION，Rename-Item
#     也被共享模式挡住 —— 本地实测三条路都走不通。
#   => 因此用 FileShare.None 独占锁模拟「该文件读不出来」：os.OpenFile 得到
#      ERROR_SHARING_VIOLATION，走 cryptFile 的 "open file ... failed: %w" 返回路径。
#      这是模拟 read error，不是真 CRC 位错。
#
# 两个会让脚手架本身失败的前提（都已在下文处理）：
#   1) --pwd/--salt 必须已被 obscure：updateObfusParm 只对带 ___Obfuscated___ 前缀的
#      值原样透传；直接传 "test" 会在 NewCipher 处 Fatal（input too short）。
#   2) --op 只认小写 en/encrypt（validate 精确比较），--op=EN 会 Fatal 退出。
#
# CI 侧注意：Setup Go 同时做两件事 —— 安装 Go 工具链，以及（cache: true 时）恢复
# Go 模块 / 构建缓存。后者是独立于 --pwd/--op 的另一个坑：
#   * setup-go 按 go-version-file 读 go.mod 时会优先使用 toolchain 指令（官方文档
#     "Uses the toolchain directive if present, otherwise falls back to the go directive"），
#     也就是本来就装 1.27.3，而不是 go 指令里的 1.26.0。
#   * restore 阶段解压的缓存 tarball 是 1.3 GB 量级，解压耗时和服务端缓存服务器抖动
#     无关地不可控；2026-11-16 那次 93 秒被取消的 run 就卡在这里。
# 因此下面显式 go-version: '1.27.x' 对齐 toolchain，并 cache: false 跳过模块缓存恢复，
# 代价是每次 build 重新下载依赖（Verified by Test 工作流同 SHA 可成功构建）。
#
# 任何一条断言失败都 exit 1。

name: crypt skip bad file (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - cmd/crypt.go
      - .github/workflows/crypt-skip-badfile-test.yml

permissions:
  contents: read

concurrency:
  group: crypt-skip-badfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skip-badfile:
    name: Enumerate with one unreadable file
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (1.27.x, no module cache)
        uses: actions/setup-go@v5
        with:
          # 与 go.mod 的 toolchain go1.27.3 对齐（用 range 以便补丁版本直接命中 runner 预装版本）
          go-version: '1.27.x'
          # 关键：不恢复 Go 模块缓存。1.3 GB 的 tarball 解压是本工作流被杀的唯一卡点。
          cache: false

      - name: Go version (must not trigger toolchain download)
        shell: pwsh
        # 验证：安装的版本必须 >= go.mod 的 toolchain，否则 go 命令会自己去下载 1.27.3，
        # 那样 cache: false 也救不了这次的超时。
        run: |
          $v = (go env GOVERSION)
          Write-Host "GOVERSION=$v"
          if ($v -notmatch '^go1\.27') { throw "期望 go1.27.x，实际 $v —— 会触发 toolchain 下载" }
          if (-not (go version)) { throw 'go 命令不可用' }

      - name: Embed placeholder (public/dist is gitignored)
        shell: pwsh
        # server/static 用 //go:embed all:dist，干净 runner 上该目录不存在就编不过。
        run: |
          New-Item -ItemType Directory -Force -Path public/dist | Out-Null
          if (-not (Test-Path public/dist/index.html)) {
            Set-Content -Path public/dist/index.html -Value '<!doctype html><title>CI placeholder</title>' -Encoding utf8
          }

      - name: Build openlist-crypt.exe
        shell: pwsh
        run: |
          go build -o openlist-crypt.exe .
          if (-not (Test-Path openlist-crypt.exe)) { throw '构建产物不存在' }
          Write-Host ('binary size = {0:N0} bytes' -f (Get-Item openlist-crypt.exe).Length)

      # 上传编译产物，便于在任意机器直接取用，不必在本地区分新旧版本。
      # if: always() 让断言步骤失败时也能拿到 exe，方便离线复现同一个二进制。
      - name: Upload openlist-crypt.exe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openlist-crypt-windows
          path: openlist-crypt.exe
          retention-days: 7
          if-no-files-found: error

      - name: Run crypt with one locked file and assert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $workspace = $env:GITHUB_WORKSPACE
          $work = Join-Path $workspace 'crypt_selftest'
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Set-Location $work

          $exe = Join-Path $workspace 'openlist-crypt.exe'
          $src = Join-Path $work 'test_src'
          $out = Join-Path $work 'test_out'

          # ---- 素材：3 个好文件 + 1 个坏文件
          New-Item -ItemType Directory -Force -Path $src, $out | Out-Null
          foreach ($n in 'a.txt','b.txt','c.txt') {
            Set-Content -Path (Join-Path $src $n) -Value "content of $n" -Encoding utf8
          }

          # ---- 等价于 obscure.Obscure('test') 的确定性密文（见文件头说明 1）
          $key = 0x9c,0x93,0x5b,0x48,0x73,0x0a,0x55,0x4d,0x6b,0xfd,0x7c,0x63,0xc8,0x86,0xa9,0x2b,0xd3,0x90,0x19,0x8e,0xb8,0x12,0x8a,0xfb,0xf4,0xde,0x16,0x2b,0x8b,0x95,0xf6,0x38
          $iv = [byte[]](1..16)
          $ctr = New-Object byte[] 32
          for ($i = 0; $i -lt 16; $i++) { $ctr[$i] = $key[$i]; $ctr[16 + $i] = $key[$i] }
          $aes = [System.Security.Cryptography.Aes]::Create()
          $aes.Mode = 'ECB'
          $aes.Padding = 'None'
          $aes.Key = $ctr
          $ks = $aes.CreateEncryptor().TransformFinalBlock($iv, 0, 16)
          $aes.Dispose()
          $pt = [Text.Encoding]::ASCII.GetBytes('test')
          $res = New-Object byte[] ($iv.Length + $pt.Length)
          [Array]::Copy($iv, 0, $res, 0, 16)
          for ($i = 0; $i -lt $pt.Length; $i++) { $res[16 + $i] = $pt[$i] -bxor $ks[$i] }
          $b64 = [Convert]::ToBase64String($res).TrimEnd('=').Replace('+','-').Replace('/','_')
          $pwdArg = '___Obfuscated___' + $b64
          Write-Host "obscured password length = $($b64.Length)"

          # ---- 独占锁住坏文件
          $bad = Join-Path $src 'bad.txt'
          $lock = [System.IO.File]::Open($bad, 'Create', 'ReadWrite', 'None')
          try {
            $lock.Write([Text.Encoding]::ASCII.GetBytes('locked'), 0, 6)
            $lock.Flush($true)
            $probeBlocked = $false
            try {
              $p = [System.IO.File]::Open($bad, 'Open', 'Read', 'ReadWrite')
              $p.Dispose()
            } catch {
              $probeBlocked = $true
              Write-Host "lock self-check OK: $($_.Exception.GetType().Name): $($_.Exception.Message)"
            }
            if (-not $probeBlocked) { throw '坏文件没有被真正锁住，测试前提不成立' }

            $logFile = Join-Path $work 'crypt-run.log'
            & $exe crypt --op=en -s test_src -d test_out --pwd=$pwdArg --salt=$pwdArg --filename-encrypt=standard --filename-encode=base64 --suffix=.bin --dirname-encrypt=true *> $logFile
            $code = $LASTEXITCODE
          } finally {
            $lock.Dispose()
          }

          $log = if (Test-Path $logFile) { Get-Content -Raw -Path $logFile } else { '' }
          # logrus 可能带颜色转义，统一剥掉再匹配
          $plain = [regex]::Replace($log, "`e\[[0-9;]*m", '')

          Write-Host '==== crypt output ===='
          Write-Host $plain
          Write-Host '==== assertions ===='

          $results = New-Object System.Collections.ArrayList
          function Check($name, $ok, $detail) {
            [void]$results.Add([pscustomobject]@{ Name = $name; Ok = [bool]$ok; Detail = $detail })
            $tag = if ($ok) { 'PASS' } else { 'FAIL' }
            Write-Host ("[$tag] $name | $detail")
          }

          # 1) 退出码必须为 0
          Check 'exit code is 0' ($code -eq 0) "exitcode=$code"

          # 2) 日志里必须有跳过记录，并且带着坏文件名
          $hasSkip = $plain -match '(?i)skip'
          $hasBad = $plain -match [regex]::Escape('bad.txt')
          $hasSummary = $plain -match '(?i)\d+ file\(s\) failed and were skipped'
          Check 'log contains a skip record' $hasSkip "match=skip -> $hasSkip"
          Check 'skip record names bad.txt' $hasBad "match=bad.txt -> $hasBad"
          Check 'log contains failure summary' $hasSummary "match=summary -> $hasSummary"

          # 3) 汇总条目数必须是 1（只有 bad.txt，好文件不能被算进去）
          $summaryCount = -1
          if ($plain -match '(?i)(\d+) file\(s\) failed and were skipped') { $summaryCount = [int]$Matches[1] }
          Check 'exactly one failure recorded' ($summaryCount -eq 1) "summaryCount=$summaryCount"

          # 4) 3 个好文件都必须产出非空密文
          $produced = @()
          if (Test-Path $out) {
            $produced = @(Get-ChildItem -Path $out -Recurse -File | Where-Object { $_.Length -gt 0 })
          }
          $names = ($produced | ForEach-Object { $_.Name }) -join ', '
          Check 'three encrypted outputs exist' ($produced.Count -eq 3) "count=$($produced.Count) names=[$names]"

          # 5) 坏文件不能留下任何产物
          $badLeftOver = @($produced | Where-Object { $_.Name -match '(?i)bad' })
          Check 'no output for the bad file' ($badLeftOver.Count -eq 0) ('leftover=' + (($badLeftOver | ForEach-Object { $_.Name }) -join ', '))

          # 6) 解回去要与原文一致，证明产物是真加密
          $restore = Join-Path $work 'test_restore'
          New-Item -ItemType Directory -Force -Path $restore | Out-Null
          & $exe crypt --op=de -s test_out -d test_restore --pwd=$pwdArg --salt=$pwdArg --filename-encrypt=standard --filename-encode=base64 --suffix=.bin --dirname-encrypt=true *> (Join-Path $work 'crypt-dec.log')
          $decCode = $LASTEXITCODE
          $restored = @()
          if (Test-Path $restore) { $restored = @(Get-ChildItem -Path $restore -Recurse -File) }
          $restoredNames = ($restored | ForEach-Object { $_.Name } | Sort-Object) -join ', '
          $roundTripOk = ($decCode -eq 0) -and ($restoredNames -eq 'a.txt, b.txt, c.txt')
          Check 'round-trip decrypt restores a/b/c' $roundTripOk "exit=$decCode files=[$restoredNames]"

          # ---- 汇总
          $failed = @($results | Where-Object { -not $_.Ok })
          Write-Host ''
          Write-Host ('TOTAL: {0}/{1} PASS' -f ($results.Count - $failed.Count), $results.Count)
          if ($failed.Count -gt 0) {
            Write-Host '---- failure detail ----'
            $failed | ForEach-Object { Write-Host ('FAIL: {0} | {1}' -f $_.Name, $_.Detail) }
            if (-not $hasSkip) { throw 'crypt 仍在第一个坏文件处中断：日志里没有 skip 记录（多半是 cryptFile 里残留 log.Fatalf）' }
            exit 1
          }
          Write-Host 'ALL ASSERTIONS PASSED'
