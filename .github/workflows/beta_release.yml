  release:
    needs:
      - changelog
    name: Beta Release (Windows amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"

      - name: Setup web
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build Windows amd64
        run: |
          mkdir -p build
          go build -o build/openlist-windows-amd64.exe \
            -ldflags="-w -s \
              -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$(date +'%F %T %z')' \
              -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@oplist.org>' \
              -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$(git log --pretty=format:'%h' -1)' \
              -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.Version=beta' \
              -X 'github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling'" \
            -tags=jsoniter .
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"

      - name: Compress
        run: |
          bash build.sh zip md5-windows-amd64.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to beta release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in build/compress/*; do
            gh release upload beta "$file" --clobber
          done

      - name: Upload assets to github artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: beta builds for windows-amd64
          path: ${{ github.workspace }}/build/compress/*
          compression-level: 0
          if-no-files-found: error
