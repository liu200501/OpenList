name: Release Build (Linux amd64)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (例如 v4.2.9)'
        required: true
        type: string
      release_name:
        description: 'Release 标题（留空则用 tag）'
        required: false
        type: string
      release_body:
        description: 'Release 描述（支持 Markdown，可多行）'
        required: false
        type: string
      prerelease:
        description: '是否为预发布？'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Go test
        run: go test ./internal/db/... ./internal/transcode/... ./internal/media/...

      - name: Setup web
        run: bash build.sh dev web
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}

      - name: Build Linux static binary
        uses: OpenListTeam/cgo-actions@v1.3.0
        with:
          targets: linux-musl-amd64
          flags: '-ldflags=-s -w'
          static-link-for-musl: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          out-dir: build
          x-flags: |
            github.com/OpenListTeam/OpenList/v4/internal/conf.BuiltAt=$built_at
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitAuthor=The OpenList Projects Contributors <noreply@oplist.org>
            github.com/OpenListTeam/OpenList/v4/internal/conf.GitCommit=$git_commit
            github.com/OpenListTeam/OpenList/v4/internal/conf.Version=$tag
            github.com/OpenListTeam/OpenList/v4/internal/conf.WebVersion=rolling
          output: openlist-${{ inputs.tag }}-linux-amd64

      - name: Package with tar.gz
        run: |
          cd build
          tar -czf openlist-${{ inputs.tag }}-linux-amd64.tar.gz openlist-${{ inputs.tag }}-linux-amd64
          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openlist_linux_amd64
          path: build/*.tar.gz

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name || inputs.tag }}
          body: ${{ inputs.release_body }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          files: artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
